services:

  campaign-job-service:
    build: .
    container_name: campaign-job-service

    ports:
      - "8002:8002"

    env_file:
      - .env

    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:7
    container_name: campaign-job-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: campaign-job-redis

    ports:
      - "6380:6379"

volumes:
  mongo_data: